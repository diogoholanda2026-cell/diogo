<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="map" aria-label="Mapa da cidade. Arraste para mover, use dois dedos para aproximar."></canvas>
<div class="vign" aria-hidden="true"></div>

<header id="hud">
  <button id="lvl" class="medal" aria-label="Nível e experiência"><b id="hLvl">1</b><span>Nível</span><small id="hXp"></small></button>
  <div class="hud-main">
    <div class="wallet">
      <div class="stat cr"><svg class="f"><use href="#i-coin"/></svg><b id="hCred">0</b></div>
      <div class="stat gm"><svg class="f"><use href="#i-gem"/></svg><b id="hGems">0</b></div>
      <div class="stat ky"><svg class="f"><use href="#i-key"/></svg><b id="hKeys">0</b></div>
      <button id="hCity" class="round sm" aria-label="Painel da cidade"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
    <div class="meters">
      <div class="stat pop" id="hJoyW"><svg class="f"><use href="#i-people"/></svg><b id="hPop">0</b><i class="face"><svg class="i"><use href="#i-smile"/></svg><em id="hJoy">0%</em></i></div>
      <div class="meter pw" id="mPow" title="Energia usada / gerada (MW)"><svg><use href="#i-bolt"/></svg><span id="hPow">0/0</span><i><em id="hPowBar"></em></i></div>
      <div class="meter wt" id="mWat" title="Água usada / fornecida (m³/h)"><svg><use href="#i-drop"/></svg><span id="hWat">0/0</span><i><em id="hWatBar"></em></i></div>
      <div class="meter rc" id="mRec" title="Resíduos gerados / reciclados"><svg><use href="#i-recycle"/></svg><span id="hRec">0/0</span><i><em id="hRecBar"></em></i></div>
      <button class="meter st" id="hStoreBtn" title="Armazém" hidden><svg><use href="#i-box"/></svg><span id="hStore">0/50</span></button>
    </div>
  </div>
</header>

<button id="goal" aria-label="Meta atual"><small id="gEye">Meta 1</small><p id="gTxt"></p><i><em id="gBar"></em></i></button>
<div id="banner" class="banner" hidden></div>
<div id="toasts" aria-live="polite"></div>

<nav id="side" aria-label="Painéis">
  <button data-act="tax" id="sTax" class="round tax" hidden><svg class="f"><use href="#i-coin"/></svg><b>§0</b></button>
  <button data-act="goals" id="sGoals" class="round"><svg class="i"><use href="#i-flag"/></svg><span>Metas</span></button>
  <button data-act="store" id="sStore" class="round"><svg class="i"><use href="#i-box"/></svg><span>Armazém</span></button>
  <button data-act="market" id="sMarket" class="round" hidden><svg class="i"><use href="#i-cart"/></svg><span>Mercado</span></button>
  <button data-act="cargo" id="sCargo" class="round" hidden><svg class="i"><use href="#i-truck"/></svg><span>Cargas</span></button>
</nav>

<nav id="dock" aria-label="Ações">
  <button id="bRoads" class="round big roads" aria-label="Ruas"><svg class="i"><use href="#i-road"/></svg><span>Ruas</span></button>
  <button id="bBuild" class="orb" aria-label="Construir"><svg class="i"><use href="#i-hammer"/></svg><span>Construir</span></button>
</nav>

<section id="bmenu" class="bmenu" hidden>
  <div class="bm-top"><div id="bTabs" class="btabs"></div><button id="bClose" class="x" aria-label="Fechar">×</button></div>
  <div id="bCards" class="bcards"></div>
</section>

<div id="placebar" class="actionbar" hidden>
  <button id="pCancel" class="btn">Cancelar</button>
  <div class="pinfo"><b id="pName"></b><small id="pMsg"></small></div>
  <button id="pOk" class="btn brass">Construir</button>
</div>

<div id="roadbar" class="actionbar" hidden>
  <div class="seg" role="group" aria-label="Ferramenta de rua"><button id="rDraw" class="on">Traçar</button><button id="rUp">Subir nível</button><button id="rErase">Remover</button></div>
  <div class="pinfo"><b>Ruas</b><small id="rMsg"></small></div>
