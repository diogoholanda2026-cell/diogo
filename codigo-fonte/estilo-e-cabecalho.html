<title>Arcologia de Held</title>
<meta name="theme-color" content="#0A1020">
<meta name="description" content="Jogo de construção de cidade: a maquete viva da Arcologia de Held, com mecânica de zonas, fábricas, lojas, serviços e comércio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Marcellus&display=swap">
<style>
:root{
  color-scheme: dark;
  --night:#0A1020;
  --panel:rgba(12,19,35,.9);
  --panel-solid:#0D1527;
  --card:#131D33;
  --card-hi:#1A2742;
  --line:rgba(201,165,90,.34);
  --brass:#C9A55A;
  --brass-hi:#E8CB86;
  --brass-ink:#1B1508;
  --aurora:#46E3B5;
  --violet:#8C7CFF;
  --ink:#ECE7DA;
  --muted:#8E98AC;
  --warn:#F0B44C;
  --danger:#FF6A5C;
  --water:#5BC0EB;
  --power:#FFD34D;
  --leaf:#86DB91;
  --f-display:"Marcellus","Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-ui:"Barlow Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;overflow:hidden;overscroll-behavior:none;
  background:var(--night);color:var(--ink);
  font:500 14px/1.35 var(--f-ui);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--aurora);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.f{width:16px;height:16px;flex:none;fill:currentColor;stroke:none}
p svg,small svg,.desc svg,.status svg.f,.c-stat svg{width:14px;height:14px;vertical-align:-2px}
h3.h{margin:14px 0 6px;font:400 17px/1.2 var(--f-display)}

#sky,#map{position:fixed;inset:0;display:block}
#map{touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
.vign{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(2,5,12,.55) 100%)}

/* ---------- HUD ---------- */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;gap:8px;align-items:flex-start;
  padding:calc(var(--sat) + 8px) 10px 18px;
  background:linear-gradient(180deg,rgba(5,9,19,.95) 0%,rgba(5,9,19,.75) 62%,rgba(5,9,19,0) 100%);
  pointer-events:none;
}
#hud > *{pointer-events:auto}
.medal{
  --xp:0;
  width:56px;height:56px;border-radius:50%;flex:none;position:relative;border:0;padding:0;
  background:conic-gradient(var(--aurora) calc(var(--xp) * 1turn), rgba(255,255,255,.1) 0);
  display:grid;place-items:center;
  box-shadow:0 0 0 1px var(--line),0 6px 16px rgba(0,0,0,.5);
}
.medal::before{content:"";position:absolute;inset:4px;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#22314f,#0a1120 70%);
  box-shadow:inset 0 0 0 1px rgba(201,165,90,.55)}
.medal b{position:relative;font:400 22px/1 var(--f-display);color:var(--brass-hi)}
.medal span{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  font:700 8.5px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;
  background:var(--brass);color:var(--brass-ink);padding:2px 5px 2px 6px;border-radius:4px;white-space:nowrap}
.medal small{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:9px;font:600 9.5px/1 var(--f-ui);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.hud-main{flex:1;min-width:0;display:grid;gap:6px}
.wallet{display:flex;gap:5px;flex-wrap:nowrap;align-items:center}
.wallet .round.sm{flex:none;width:36px;height:36px;box-shadow:none}
.wallet .round.sm svg.i{width:19px;height:19px}
.stat{display:flex;align-items:center;gap:4px;min-width:0;flex:1 1 auto;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 9px 5px 6px}
.stat svg{width:16px;height:16px;flex:none}
.stat b{font:600 15px/1 var(--f-ui);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.cr svg{color:var(--brass-hi)}
.stat.cr{flex:1.5 1 auto}
.stat.gm svg{color:var(--violet)}
.stat.ky svg{color:var(--warn)}
.stat.pop{flex:0 0 auto;padding:3px 8px 3px 6px}
.stat.pop b{font-size:13.5px}
.stat.pop svg.f{color:#C9D3E6;width:14px;height:14px}
.stat .face{display:inline-flex;align-items:center;gap:2px;margin-left:2px;font:600 11px/1 var(--f-ui);color:var(--aurora);font-style:normal}
.stat .face svg{width:12px;height:12px;color:var(--aurora)}
.stat.pop.low .face,.stat.pop.low .face svg{color:var(--warn)}
.stat.pop.high .face,.stat.pop.high .face svg{color:var(--aurora)}
.meters{display:flex;gap:7px;padding-inline:2px;align-items:center}
.meter{flex:1 1 0;min-width:0;display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:4px;row-gap:3px;
  font:500 11px/1 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;background:none;border:0;padding:0;text-align:left}
.meter svg{width:12px;height:12px;grid-row:span 2;fill:none;stroke:currentColor;stroke-width:1.8}
.meter.pw svg{color:var(--power);fill:currentColor;stroke:none}
.meter.wt svg{color:var(--water);fill:currentColor;stroke:none}
.meter.rc svg{color:var(--leaf)}
.meter.st svg{color:var(--brass-hi)}
.meter.st{flex:0 0 auto;grid-template-columns:auto auto}
.meter.st span.full{color:var(--warn)}
.meter span{overflow:hidden;text-overflow:ellipsis}
.meter i{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.meter em{display:block;height:100%;width:0;border-radius:2px;transition:width .3s}
.meter.pw em{background:var(--power)}
.meter.wt em{background:var(--water)}
.meter.rc em{background:var(--leaf)}
.meter.bad span{color:var(--danger)}
.meter.bad em{background:var(--danger)}
.meter span{font-size:10.5px}
@media (max-width:430px){.stat .face em{display:none}.meters{gap:5px}}
@media (max-width:380px){.stat b{font-size:13.5px}.stat{padding:5px 7px 5px 5px}}

.round{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(0,0,0,.45);padding:0;position:relative}
.round svg.i{width:22px;height:22px}
.round.sm{width:40px;height:40px}
.round span{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font:700 9px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.round.dot::after{content:"";position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:var(--aurora);box-shadow:0 0 0 2px #070c18}

/* meta */
#goal{
  position:fixed;z-index:19;left:10px;top:calc(var(--sat) + 104px);
  max-width:min(250px,calc(100% - 90px));text-align:left;
  display:grid;gap:4px;padding:8px 12px 9px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.35);transition:opacity .2s
}
#goal small{font:700 10px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
#goal p{margin:0;font:500 13px/1.25 var(--f-ui)}
#goal i{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
#goal em{display:block;height:100%;background:var(--aurora);width:0;transition:width .3s}
#goal.hush{opacity:0;pointer-events:none}

.banner{
  position:fixed;z-index:19;left:50%;transform:translateX(-50%);
  top:calc(var(--sat) + 104px);
  width:max-content;max-width:calc(100% - 32px);text-align:center;
  padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  font:500 13px/1.3 var(--f-ui);pointer-events:none;
}

/* ---------- painéis laterais e dock ---------- */
#side{position:fixed;right:10px;top:calc(var(--sat) + 108px);z-index:18;display:grid;gap:18px;justify-items:center}
#side .round.tax{width:auto;height:38px;border-radius:999px;padding:0 12px 0 8px;display:flex;gap:5px;align-items:center;
  background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--brass-ink);border-color:transparent;animation:pulse 1.6s ease-in-out infinite}
#side .round.tax svg{width:18px;height:18px;color:#FFF3CF}
#side .round span{left:auto;right:0;transform:none;text-align:right}
#side .round.tax b{font:700 13px/1 var(--f-ui);font-variant-numeric:tabular-nums}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding:0 14px calc(var(--sab) + 14px);display:flex;justify-content:space-between;align-items:flex-end}
#dock > *{pointer-events:auto}
.round.big{width:56px;height:56px}
.round.big svg.i{width:26px;height:26px}
.orb{width:74px;height:74px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 34% 28%,#F3DDA2,var(--brass) 58%,#7E632A);
  box-shadow:0 10px 24px rgba(0,0,0,.6),0 0 0 3px #070c18,0 0 0 4px var(--line)}
.orb svg.i{width:34px;height:34px;color:var(--brass-ink);stroke-width:2.2}
.orb span{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;font:700 9.5px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--brass-hi);white-space:nowrap}
.orb:active{transform:scale(.96)}
#dock{padding-bottom:calc(var(--sab) + 26px)}

/* ---------- menu de construção ---------- */
.bmenu{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(0deg,rgba(5,9,19,.98),rgba(9,14,27,.94));border-top:1px solid var(--brass);
  padding:8px 0 calc(var(--sab) + 8px);transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.bmenu.open{transform:none}
.bm-top{display:flex;align-items:center;gap:6px;padding:0 10px}
.btabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px 0}
.btabs::-webkit-scrollbar{display:none}
.btab{flex:none;display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 11px;font:600 12px/1 var(--f-ui)}
.btab svg{width:15px;height:15px}
.btab.on{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.bcards{display:flex;gap:9px;overflow-x:auto;padding:10px 12px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.bcards::-webkit-scrollbar{display:none}
.bcard{flex:none;width:152px;scroll-snap-align:start;position:relative;text-align:left;display:flex;flex-direction:column;gap:4px;padding:0 0 9px;
  background:var(--card);border:1px solid rgba(201,165,90,.2);border-radius:13px;overflow:hidden}
.bcard:active{border-color:var(--brass)}
.bcard .thumb{display:block;height:84px;position:relative;background:#0b1222;overflow:hidden}
.bcard .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.bcard .thumb .rd{display:grid;place-items:center;height:100%;color:var(--brass-hi)}
.bcard .thumb .rd svg{width:40px;height:40px}
.fp{position:absolute;right:6px;top:6px;font:700 11px/1 var(--f-ui);background:rgba(5,9,19,.82);border-radius:6px;padding:4px 6px;color:var(--brass-hi);letter-spacing:.04em}
.cnt{position:absolute;left:6px;top:6px;font:700 11px/1 var(--f-ui);background:rgba(5,9,19,.82);border-radius:6px;padding:4px 6px;color:var(--ink)}
.c-name{font:400 14.5px/1.15 var(--f-display);padding:4px 10px 0}
.c-stat{font:500 11.5px/1.25 var(--f-ui);color:var(--muted);padding:0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-cost{display:flex;flex-wrap:wrap;gap:3px 7px;align-items:center;font:600 13px/1 var(--f-ui);padding:3px 10px 0;margin-top:auto}
.c-cost small{color:var(--muted);font-weight:500}
.cr{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.cr svg{width:14px;height:14px;color:var(--brass-hi)}
.cr.gem svg{color:var(--violet)}
.cr.key svg{color:var(--warn)}
.bcard.poor .c-cost .cr:first-child{color:var(--danger)}
.bcard.locked .thumb img{filter:grayscale(1) brightness(.42)}
.bcard.locked .c-name,.bcard.locked .c-stat,.bcard.locked .c-cost{opacity:.55}
.lock{position:absolute;left:0;right:0;top:0;height:84px;display:grid;place-items:center;align-content:center;gap:4px;
  font:700 12px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.lock svg{width:20px;height:20px;color:var(--brass-hi)}

/* ---------- barras de ação ---------- */
.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:26;
  padding:8px 10px calc(var(--sab) + 8px);
  background:linear-gradient(0deg,rgba(5,9,19,.97),rgba(7,12,24,.9));border-top:1px solid var(--line);
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pinfo{min-width:0;display:grid;gap:2px}
.pinfo b{font:400 15px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo small{font:500 12px/1.25 var(--f-ui);color:var(--muted)}
.pinfo small.ok{color:var(--aurora)}
.pinfo small.bad{color:var(--danger)}
.pinfo small.warn{color:var(--warn)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:10px 10px;font:600 12.5px/1 var(--f-ui);color:var(--muted);min-height:44px;white-space:nowrap}
.seg button.on{background:var(--brass);color:var(--brass-ink)}
@media (max-width:420px){#roadbar{grid-template-columns:1fr auto}#roadbar .pinfo{display:none}}

.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:12px;
  padding:10px 16px;min-height:46px;font:600 15px/1 var(--f-ui);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.brass{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--brass-ink);border-color:transparent}
.btn.brass .cr svg{color:var(--brass-ink)}
.btn.aur{background:rgba(70,227,181,.12);border-color:rgba(70,227,181,.5);color:var(--aurora)}
.btn.aur .cr.gem svg{color:var(--violet)}
.btn.danger{border-color:rgba(255,106,92,.45);color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#1a0806;border-color:transparent}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{min-height:36px;padding:8px 12px;font-size:13.5px;border-radius:10px}

/* ---------- folha inferior ---------- */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  max-height:min(78vh,720px);display:flex;flex-direction:column;
  background:var(--panel-solid);border-top:1px solid var(--brass);border-radius:20px 20px 0 0;
  box-shadow:0 -14px 44px rgba(0,0,0,.65);
  transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);
  padding-bottom:var(--sab);
}
.sheet.open{transform:none}
@media (min-width:720px){.sheet{left:50%;right:auto;width:600px;margin-left:-300px}}
.grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:8px auto 2px}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:6px 16px 10px}
.sheet-h small{display:block;font:700 10.5px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.sheet-h h2{margin:5px 0 0;font:400 22px/1.12 var(--f-display);text-wrap:balance}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;font:400 22px/1 var(--f-ui);color:var(--muted)}
.sheet-b{overflow:auto;padding:0 16px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;user-select:text;-webkit-user-select:text}

.hero{margin:0 0 12px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0b1222;position:relative}
.hero img{display:block;width:100%;max-height:210px;object-fit:cover}
.hero.low img{max-height:130px}
.hero figcaption{position:absolute;left:10px;bottom:10px;font:700 10.5px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;
  background:linear-gradient(180deg,#E3C67F,#B8924A);color:var(--brass-ink);padding:5px 8px;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.pips{display:flex;gap:4px;margin:-2px 0 10px}
.pips i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}
.pips i.on{background:var(--brass)}
.status{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:11px;margin:0 0 12px;
  background:rgba(70,227,181,.08);border:1px solid rgba(70,227,181,.3);font:500 13px/1.35 var(--f-ui)}
.status.bad{background:rgba(255,106,92,.08);border-color:rgba(255,106,92,.35)}
.status.warn{background:rgba(240,180,76,.08);border-color:rgba(240,180,76,.35)}
.status svg{width:17px;height:17px;margin-top:1px;flex:none}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin:0 0 12px}
.kv div{background:var(--card);border-radius:10px;padding:9px 11px;display:grid;gap:4px}
.kv dt{font:600 10.5px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font:600 17px/1.1 var(--f-ui);font-variant-numeric:tabular-nums}
.svc{display:flex;gap:4px}
.svc i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:rgba(255,106,92,.15);color:var(--danger)}
.svc i.ok{background:rgba(70,227,181,.15);color:var(--aurora)}
.svc i svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8}
.svc i svg.f{fill:currentColor;stroke:none}
.desc{margin:0 0 14px;color:#C8C3B6;font:400 14px/1.45 var(--f-ui);max-width:62ch}
.box{border:1px solid var(--line);border-radius:13px;padding:12px;margin:0 0 12px;display:grid;gap:10px;background:rgba(201,165,90,.04)}
.box h3{margin:0;font:400 17px/1.2 var(--f-display);display:flex;align-items:center;gap:6px}
.box h3 svg{width:18px;height:18px}
.box p{margin:0;font:500 13px/1.4 var(--f-ui);color:var(--muted)}
.box p.hint{font-size:12.5px}
.req{display:flex;flex-wrap:wrap;gap:6px}
.req span{display:inline-flex;align-items:center;gap:4px;background:var(--card);border-radius:8px;padding:6px 9px;font:600 13px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.req span.short{color:var(--danger);box-shadow:inset 0 0 0 1px rgba(255,106,92,.4)}
.req svg{width:14px;height:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .btn{flex:1 1 auto}
.row.wrap{margin-bottom:10px}

/* itens */
.it{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:color-mix(in srgb,var(--c,#ccc) 18%,transparent);color:var(--c,#ccc);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,#ccc) 45%,transparent);flex:none}
.it svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.it.big{width:40px;height:40px;border-radius:11px}
.it.big svg{width:24px;height:24px}
.mc{display:inline-flex;align-items:center;gap:2px;color:var(--c,#ccc);font-variant-numeric:tabular-nums;font:600 12.5px/1 var(--f-ui)}
.mc svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
.mc.short{color:var(--danger)}
.need{display:flex;flex-wrap:wrap;gap:8px}
.ni{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:7px;align-items:center;padding:6px 10px 6px 7px;border-radius:11px;background:var(--card);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,#ccc) 35%,transparent)}
.ni svg{grid-row:span 2;width:24px;height:24px;color:var(--c,#ccc);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ni b{font:700 14px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.ni small{font:500 11px/1 var(--f-ui);color:var(--muted)}
.ni.short b{color:var(--danger)}
.ni.ok b{color:var(--aurora)}

/* produção */
.queue{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slot{--f:0;width:52px;height:52px;border-radius:12px;background:var(--card);display:grid;place-items:center;align-content:center;gap:2px;position:relative;font:600 10px/1 var(--f-ui);color:var(--muted);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.slot.empty{color:rgba(255,255,255,.25);font-size:20px;border:1px dashed rgba(255,255,255,.15);background:transparent;box-shadow:none}
.slot.cur{background:conic-gradient(var(--aurora) calc(var(--f) * 1turn),rgba(255,255,255,.08) 0);cursor:pointer}
.slot.cur::before{content:"";position:absolute;inset:3px;border-radius:9px;background:var(--card)}
.slot .it,.slot small{position:relative}
.slot small{font-size:9.5px;color:var(--ink)}
.ready{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:10px;background:rgba(70,227,181,.08);border:1px solid rgba(70,227,181,.3)}
.ready span{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font:600 13px/1 var(--f-ui)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pitem{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:9px;align-items:center;text-align:left;padding:8px 9px;border-radius:12px;background:var(--card);border:1px solid rgba(255,255,255,.06)}
.pitem .it{grid-row:span 3}
.pitem b{font:600 13.5px/1.15 var(--f-ui)}
.pitem small{font:500 11px/1.2 var(--f-ui);color:var(--muted)}
.pitem .ins{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.pitem:disabled{opacity:.5;cursor:not-allowed}
.pitem.poor{border-color:rgba(255,106,92,.3)}
.pitem:not(:disabled):active{border-color:var(--brass)}

/* armazém e depósito */
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin:0 0 6px}
.inv-it{display:grid;justify-items:center;gap:3px;padding:8px 4px 7px;border-radius:11px;background:var(--card);border:1px solid transparent;color:var(--c,#ccc)}
.inv-it svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.inv-it b{font:700 14px/1 var(--f-ui);color:var(--ink);font-variant-numeric:tabular-nums}
.inv-it small{font:500 10.5px/1 var(--f-ui);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-it.none{opacity:.45}
.inv-it.on{border-color:var(--brass);background:var(--card-hi)}
.depot{display:grid;gap:8px;margin:0 0 12px}
.dslot{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;padding:9px 11px;border-radius:12px;background:var(--card)}
.dslot b{font:600 14px/1.2 var(--f-ui)}
.dslot small{font:500 12px/1.2 var(--f-ui);color:var(--muted)}
.dslot .it{grid-row:span 2}
.dslot.free{grid-template-columns:1fr;background:var(--card-hi);box-shadow:inset 0 0 0 1px var(--line)}
.dslot.free b{display:flex;align-items:center;gap:6px}
.dslot.empty{grid-template-columns:1fr;border:1px dashed rgba(255,255,255,.15);background:transparent;text-align:center;padding:12px}
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.offer{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:9px;align-items:center;text-align:left;padding:8px 9px;border-radius:12px;background:var(--card);border:1px solid rgba(255,255,255,.06)}
.offer .it{grid-row:span 2}
.offer b{font:600 13.5px/1.15 var(--f-ui)}
.offer small{font:600 12.5px/1 var(--f-ui);color:var(--brass-hi)}
.offer.poor small .cr{color:var(--danger)}
.offer.sold{opacity:.4}
.crates{display:grid;gap:8px;margin:0 0 12px}
.crate{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:9px 11px;border-radius:12px;background:var(--card)}
.crate .it{grid-row:span 2}
.crate > svg{grid-row:span 2;width:22px;height:22px;color:var(--aurora);fill:none;stroke:currentColor;stroke-width:2.2}
.crate .btn{grid-row:span 2}
.crate b{font:600 14px/1.2 var(--f-ui)}
.crate small{font:500 12px/1.2 var(--f-ui);color:var(--muted)}
.crate.ok{background:rgba(70,227,181,.08);box-shadow:inset 0 0 0 1px rgba(70,227,181,.3)}

/* metas */
.goals{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.goals li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:11px;background:var(--card)}
.goals li.cur{box-shadow:inset 0 0 0 1px var(--brass)}
.goals li.done{opacity:.55}
.goals li.next{opacity:.6}
.goals .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--f-ui);background:rgba(255,255,255,.07);color:var(--muted);font-variant-numeric:tabular-nums}
.goals .n svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4}
.goals li.done .n{background:var(--aurora);color:#062319}
.goals li.cur .n{background:var(--brass);color:var(--brass-ink)}
.goals p{margin:0;font:500 13.5px/1.3 var(--f-ui)}
.goals small{font:600 12px/1 var(--f-ui);color:var(--brass-hi);white-space:nowrap;display:inline-flex;align-items:center;gap:2px}
.goals small svg{width:12px;height:12px}

/* cidade */
.help{margin:0;padding:0 0 0 18px;display:grid;gap:7px;font:400 13.5px/1.45 var(--f-ui);color:#C8C3B6}
.help b{color:var(--ink);font-weight:600}
details.box summary{cursor:pointer;font:400 17px/1.2 var(--f-display);list-style:none}
details.box summary::-webkit-details-marker{display:none}
details.box summary::after{content:" +";color:var(--brass)}
details[open].box summary::after{content:" –"}

/* toasts + modal */
#toasts{position:fixed;z-index:45;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 104px);
  width:min(360px,calc(100% - 32px));display:grid;gap:6px;pointer-events:none}
.toast{display:flex;gap:9px;align-items:center;padding:10px 14px;border-radius:12px;background:#111B30;border:1px solid var(--line);
  box-shadow:0 10px 26px rgba(0,0,0,.5);font:500 13.5px/1.3 var(--f-ui);animation:tin .25s ease both}
.toast.good{border-color:rgba(70,227,181,.55)}
.toast.bad{border-color:rgba(255,106,92,.55)}
.toast svg{width:18px;height:18px;color:var(--brass-hi);flex:none;fill:none;stroke:currentColor;stroke-width:2}
.toast svg.f{fill:currentColor;stroke:none}
.toast.out{animation:tout .3s ease both}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(3,6,13,.7)}
.modal-card{width:min(380px,100%);max-height:88vh;overflow:auto;text-align:center;padding:24px 20px 20px;border-radius:20px;
  background:radial-gradient(120% 70% at 50% 0%,rgba(70,227,181,.16),transparent 60%),radial-gradient(90% 60% at 80% 0%,rgba(140,124,255,.16),transparent 60%),var(--panel-solid);
  border:1px solid var(--brass);box-shadow:0 30px 70px rgba(0,0,0,.7);animation:tin .3s ease both}
.modal-card small{font:700 11px/1 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
.modal-card h2{margin:10px 0 6px;font:400 44px/1 var(--f-display);color:var(--brass-hi);text-shadow:0 0 24px rgba(70,227,181,.35)}
.modal-card h2.m{font-size:28px;line-height:1.1;text-wrap:balance}
.modal-card p{margin:0 0 14px;color:#C8C3B6;font:500 14px/1.45 var(--f-ui)}
.unl{display:grid;gap:8px;margin:0 0 16px;text-align:left}
.unl div{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;background:var(--card);border-radius:10px;padding:6px}
.unl img{width:64px;height:42px;object-fit:cover;border-radius:6px}
.unl .unl-ic{display:grid;place-items:center;height:42px;color:var(--brass-hi)}
.unl .unl-ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.unl b{font:400 14.5px/1.2 var(--f-display)}
.unl small{letter-spacing:0;text-transform:none;color:var(--muted);font-weight:500;font-size:12px}
.modal-card .btn{width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
