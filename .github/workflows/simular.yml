name: Robô de equilíbrio

# A cada envio, roda a suíte do jogo novo: os testes de regra, de simulação, de render sem GPU e de interface
# (ferramentas/testes/*.teste.mjs, inclusive o robô do A2 em 6 sementes) e a guarda de texto.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simular:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Testes e guarda de texto
        run: npm run simular:testes
