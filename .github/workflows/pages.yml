name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/simcity-buildit-mechanics-8on6jq, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site (app instalável em app/)
        run: |
          mkdir -p site
          cp -r app/. site/
          cp arcologia-de-held.html site/arcologia-de-held.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
